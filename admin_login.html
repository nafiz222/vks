<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Online Application</title>
    <!-- Tailwind CSS CDN for quick styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        tealCustom: '#0d9488',
                        orangeCustom: '#f97316'
                    }
                }
            }
        }
    </script>
    <!-- Supabase JS Client Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen">

    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border-t-4 border-orangeCustom">
        <div class="text-center mb-6">
            <h1 class="text-3xl font-bold text-tealCustom">Admin Login</h1>
            <p class="text-sm text-slate-500 mt-1">অনলাইন অ্যাপ্লিকেশন ম্যানেজমেন্ট সিস্টেম</p>
        </div>

        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Username / Email</label>
                <input type="text" id="username" required 
                    class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-tealCustom focus:outline-none"
                    placeholder="Enter admin username">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
                <input type="password" id="password" required 
                    class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-tealCustom focus:outline-none"
                    placeholder="••••••••">
            </div>

            <div id="errorMsg" class="text-red-500 text-sm hidden"></div>

            <button type="submit" 
                class="w-full bg-orangeCustom text-white font-semibold py-2.5 rounded-lg hover:bg-orange-600 transition duration-200">
                Login to Dashboard
            </button>
        </form>
    </div>

    <!-- Supabase Connection & Auth Logic -->
    <script>
        // আপনার Supabase প্রজেক্টের ক্রিপ্টোগ্রাফিক তথ্য
        const SUPABASE_URL = 'YOUR_SUPABASE_URL'; // এখানে আপনার Supabase URL বসাবেন
        const SUPABASE_ANON_KEY = 'sb_publishable_7l4_lO3Qom7m3Ie57PkbpQ_UndL6X3R'; // আপনার দেওয়া Publishable Key

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');

            errorMsg.classList.add('hidden');

            try {
                // Supabase থেকে অ্যাডমিন ডাটা চেক করা
                const { data, error } = await supabaseClient
                    .from('admins')
                    .select('*')
                    .eq('username', username)
                    .single();

                if (error || !data) {
                    throw new Error('ভুল ইউজারনেম অথবা পাসওয়ার্ড!');
                }

                // পাসওয়ার্ড ম্যাচিং (সিম্পল চেক বা হাশ চেক)
                if (data.password === password) {
                    localStorage.setItem('admin_logged', 'true');
                    localStorage.setItem('admin_user', data.username);
                    window.location.href = 'admin_dashboard.html'; // সফল হলে ড্যাশবোর্ডে যাবে
                } else {
                    throw new Error('পাসওয়ার্ড ভুল রয়েছে!');
                }

            } catch (err) {
                errorMsg.textContent = err.message;
                errorMsg.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
